[project]
name = "jevbench"
dynamic = ["version"]
description = "Coherence and stability tests (not accuracy or speed) for Jev-compatible typed decision models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Chen Feng", email = "c.feng@qub.ac.uk"}]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["evaluation", "metamorphic testing", "coherence", "consistency", "robustness", "decision models", "jev"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://jevbench.github.io"
Repository = "https://github.com/JevBench/jevbench"
Issues = "https://github.com/JevBench/jevbench/issues"
Results = "https://jevbench.github.io"

[project.optional-dependencies]
# generate your own cases: `jevbench datagen` (writer and verifier models are reached over HTTP;
# transformers only checks case lengths against an encoder tokenizer)
datagen = ["transformers>=4.40"]
test = ["pytest>=8"]

[project.scripts]
jevbench = "jevbench.cli:main"

[build-system]
requires = ["setuptools>=77"]  # license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jevbench.__version__"}

[tool.setuptools.package-data]
jevbench = ["suites/*/*.jsonl", "suites/*/*.jsonl.gz", "suites/*/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
